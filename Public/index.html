<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Todo List | CS4241 Assignment 3</title>

    <meta name="description" content="A personal todo list application for creating, editing, and managing tasks.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/main.css">

    <script src="js/main.js" defer></script>
</head>

<body>
<header class="container pt-4">
    <h1 class="mb-4">Todo List</h1>
</header>

<main class="container pb-4">

    <section aria-labelledby="add-task-heading">
        <h2 id="add-task-heading" class="visually-hidden">
            Add a new task
        </h2>

        <form id="todo-form" class="row g-2 align-items-end mb-4">

            <div class="col-md-6">
                <label for="task" class="form-label">
                    Task
                </label>

                <input type="text" id="task" class="form-control" placeholder="What needs to get done?" required autocomplete="off">
            </div>

            <div class="col-md-3">
                <label for="priority" class="form-label">
                    Priority
                </label>

                <select id="priority" class="form-select">
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
            </div>

            <div class="col-md-3">
                <button type="submit" class="btn btn-primary w-100">
                    Add task
                </button>
            </div>

        </form>
    </section>

    <section aria-labelledby="todo-heading">
        <h2 id="todo-heading" class="mb-3">
            Your Tasks
        </h2>

        <div id="todo-status" class="visually-hidden" aria-live="polite"></div>

        <div class="table-responsive">
            <table id="todo-table" class="table table-striped table-hover align-middle">
                <caption class="visually-hidden">
                    Your todo tasks, including priority, creation date,
                    deadline, and available actions.
                </caption>

                <thead>
                <tr>
                    <th scope="col">Task</th>
                    <th scope="col">Priority</th>
                    <th scope="col">Created</th>
                    <th scope="col">Deadline</th>
                    <th scope="col">Actions</th>
                </tr>
                </thead>

                <tbody id="todo-body">
                </tbody>
            </table>
        </div>
    </section>

</main>
</body>
</html>
