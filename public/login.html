<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Log In | CS4241 Todo List</title>

    <meta name="description" content="Log in to your personal CS4241 todo list application.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/main.css">
</head>

<body class="login-page">

<main class="container d-flex align-items-center justify-content-center min-vh-100">

    <section class="w-100" style="max-width: 360px;" aria-labelledby="login-heading">

        <h1 id="login-heading" class="mb-4 text-center">
            Log In
        </h1>

        <form action="/login" method="POST">

            <div class="mb-3">
                <label for="username" class="form-label">
                    Username
                </label>

                <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" autocomplete="username" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">
                    Password
                </label>

                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Log In</button>

        </form>

        <p class="form-text mt-3">
            If this username does not already exist, a new account will
            be created automatically.
        </p>

    </section>

</main>

</body>
</html>
